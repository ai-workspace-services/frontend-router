name: Tagged Frontend Router Release

on:
  push:
    tags:
      - 'daily-build-*'
      - 'uat-daily-build-*'
      - 'v*'

jobs:
  projectCI:
    name: ProjectCI build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^(uat-daily-build-|daily-build-|v)[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Unsupported or unsafe release tag: ${RELEASE_TAG}" >&2
            exit 2
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run ProjectCI checks
        run: ./scripts/ci/check.sh

      - name: Bundle worker and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [[ "${SOURCE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out source ${SOURCE_SHA} does not match github.sha ${GITHUB_SHA}" >&2
            exit 2
          fi
          export SOURCE_SHA
          rm -rf dist release-assets
          npx wrangler deploy --dry-run --outdir dist
          test -s dist/index.js
          mkdir -p release-assets
          cp dist/index.js release-assets/frontend-router-worker.js
          node <<'NODE'
          const fs = require('node:fs');
          const metadata = {
            schema_version: 1,
            tag: process.env.RELEASE_TAG,
            source_sha: process.env.SOURCE_SHA,
          };
          fs.writeFileSync(
            'release-assets/release-metadata.json',
            `${JSON.stringify(metadata)}\n`,
          );
          NODE
          (
            cd release-assets
            sha256sum frontend-router-worker.js release-metadata.json > SHA256SUMS
          )
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Upload release assets between jobs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-router-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish immutable GitHub release
    needs: projectCI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^(uat-daily-build-|daily-build-|v)[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Unsupported or unsafe release tag: ${RELEASE_TAG}" >&2
            exit 2
          fi

      - name: Download built release assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-router-release-assets
          path: release-assets

      - name: Verify release asset contract
        run: |
          set -euo pipefail
          test -s release-assets/frontend-router-worker.js
          test -s release-assets/release-metadata.json
          test -s release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)
          RELEASE_TAG="${RELEASE_TAG}" node <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync('release-assets/release-metadata.json', 'utf8'));
          if (metadata.schema_version !== 1 || metadata.tag !== process.env.RELEASE_TAG || metadata.source_sha !== process.env.GITHUB_SHA) {
            throw new Error('release-metadata.json does not match the immutable asset contract');
          }
          NODE

      - name: Refuse to overwrite an existing release
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite immutable assets" >&2
            exit 1
          fi

      - name: Publish release assets
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "frontend-router ${RELEASE_TAG}" \
            --notes "Bundled frontend-router Worker artifact for ${RELEASE_TAG}." \
            release-assets/frontend-router-worker.js \
            release-assets/release-metadata.json \
            release-assets/SHA256SUMS
